# Sous-flow : démarre une war 12p contre 6v6 Squad avec 6 joueurs ALÉATOIRES.
# Auto-nettoyant. Exécute pick.js → output.player0..5 / circuit(2) / p0..5 / score / subIn.
appId: fr.harmoniamk.statsmkworld.debug
---
- stopApp
- launchApp
- runScript: ../scripts/pick.js
# Annule une éventuelle war résiduelle
- runFlow:
    when:
      visible: "Courses restantes:.*"
    commands:
      - tapOn: "Courses restantes:.*"
      - tapOn: "Plus d'actions"
      - tapOn: "Annuler la war"
      - tapOn: "Effacer la war"
      - assertVisible: "Nouvelle war"
- tapOn: "12 joueurs"
- tapOn: "Nouvelle war"
- tapOn: "Rechercher une équipe…"
- inputText: "Squad"
- tapOn: "6v6 Squad"
- tapOn: "Suivant"
- assertVisible: "Sélection de la Line-up"
# 6 joueurs aléatoires (tous visibles sans scroll)
- tapOn: "${output.player0}"
- tapOn: "${output.player1}"
- tapOn: "${output.player2}"
- tapOn: "${output.player3}"
- tapOn: "${output.player4}"
- tapOn: "${output.player5}"
- scrollUntilVisible:
    element:
      text: "Commencer"
    direction: DOWN
- tapOn: "Commencer"
- assertVisible: "Plus d'actions"
