# Saisie d'une course 12p (réf. TESTS_FUNCTIONAL.md §7) + vérif scoring. Idempotent.
appId: fr.harmoniamk.statsmkworld.debug
---
- runFlow: ../subflows/start_war_12p.yaml
- tapOn: "Course suivante"
- assertVisible: "Sélection du circuit"
- tapOn: "Circuit Mario Bros."
- assertVisible: "Sélection des positions"
# 6 positions (1→6) ; positions prises masquées au fur et à mesure
- tapOn: "^1$"
- tapOn: "^2$"
- tapOn: "^3$"
- tapOn: "^4$"
- tapOn: "^5$"
- tapOn: "^6$"
- assertVisible: "Résumé"
# Scoring 12p attendu : 15+12+10+9+8+7 = 61 ; adverse = 82-61 = 21
- assertVisible: "61 - 21"
- tapOn: "Confirmer"
- assertVisible: "Plus d'actions"      # retour war en cours, course enregistrée
- takeScreenshot: .maestro/screenshots/track_added
# Nettoyage
- runFlow: ../subflows/cancel_current_war.yaml
