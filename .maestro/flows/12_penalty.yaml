# Pénalité (réf. TESTS_FUNCTIONAL.md §8.1). Idempotent (war annulée à la fin).
appId: fr.harmoniamk.statsmkworld.debug
---
- runFlow: ../subflows/start_war_12p.yaml
- tapOn: "Plus d'actions"
- assertVisible: "Pénalité"
- tapOn: "-10 pour 6v6 Squad"
- tapOn: "Valider"
- assertVisible: "Plus d'actions"      # retour war en cours après application
- takeScreenshot: .maestro/screenshots/penalty_applied
- runFlow: ../subflows/cancel_current_war.yaml
