# Remplacement de joueur (réf. TESTS_FUNCTIONAL.md §8.2). Idempotent.
appId: fr.harmoniamk.statsmkworld.debug
---
- runFlow: ../subflows/start_war_12p.yaml
- tapOn: "Plus d'actions"
- tapOn: "Remplacement"
- tapOn: "Arthug"        # joueur sortant
- tapOn: "Nosta"         # joueur entrant
- scrollUntilVisible:
    element:
      text: "Remplacer"
    direction: DOWN
- tapOn: "Remplacer"
- assertVisible: "Plus d'actions"      # retour war en cours
- takeScreenshot: .maestro/screenshots/substitution_done
- runFlow: ../subflows/cancel_current_war.yaml
